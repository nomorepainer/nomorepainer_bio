<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>404 — Страница не найдена</title>
<link rel="icon" type="image/png" href="socials/duck.png">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    background: #000;
    color: #e6ecff;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px;
    position: relative;
    overflow: hidden;
  }

  body::after {
    content: "";
    position: fixed;
    inset: 0;
    pointer-events: none;
    z-index: 9999;
    opacity: 0.06;
    background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E");
    background-size: 180px 180px;
    mix-blend-mode: overlay;
    animation: grain 8s steps(10) infinite;
  }

  @keyframes grain {
    0%, 100% { transform: translate(0, 0); }
    10%      { transform: translate(-2%, -3%); }
    20%      { transform: translate(-4%, 2%); }
    30%      { transform: translate(2%, -4%); }
    40%      { transform: translate(-3%, 3%); }
    50%      { transform: translate(-4%, 1%); }
    60%      { transform: translate(3%, -2%); }
    70%      { transform: translate(-1%, 3%); }
    80%      { transform: translate(2%, 2%); }
    90%      { transform: translate(-3%, -1%); }
  }

  .card {
    position: relative;
    z-index: 1;
    width: 100%;
    max-width: 520px;
    background: #000;
    border: 1px solid #1b2540;
    border-radius: 20px;
    padding: 60px 32px;
    text-align: center;
  }

  h1 {
    font-size: 96px;
    font-weight: 900;
    letter-spacing: 2px;
    margin-bottom: 16px;
    background: linear-gradient(90deg, #e6ecff, #9db4ff, #6a5cff, #2fd6ff, #e6ecff);
    background-size: 300% 100%;
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
    animation: rgbFlow 4s linear infinite;
  }

  @keyframes rgbFlow {
    0%   { background-position: 0% 50%; }
    100% { background-position: 300% 50%; }
  }

  p {
    font-size: 16px;
    color: #7a86a8;
    margin-bottom: 32px;
    line-height: 1.6;
  }

  a.back-btn {
    display: inline-flex;
    align-items: center;
    gap: 10px;
    padding: 14px 36px;
    font-size: 15px;
    letter-spacing: 1px;
    color: #e6ecff;
    background: #000;
    border: 1px solid #1b2540;
    border-radius: 12px;
    text-decoration: none;
    transition: border-color 0.25s ease, box-shadow 0.25s ease;
    font-family: inherit;
  }

  a.back-btn:hover {
    border-color: rgba(61,123,255,0.6);
    box-shadow: 0 0 28px rgba(61,123,255,0.35);
  }

  @media (max-width: 480px) {
    h1 { font-size: 72px; }
    .card { padding: 40px 20px; }
  }
</style>
</head>
<body>

  <div class="card">
    <h1>404</h1>
    <p>Страница не найдена.<br>Может, ты ошибся адресом?</p>
    <a class="back-btn" href="/">← На главную</a>
  </div>

</body>
</html>
