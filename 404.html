<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>404 — Страница не найдена</title>
<link rel="icon" type="image/png" href="socials/duck.png">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  html, body {
    height: 100%;
  }

  body {
    background: #000;
    color: #e6ecff;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 24px;
    position: relative;
    overflow: hidden;
  }

  .code {
    font-size: 96px;
    font-weight: 900;
    letter-spacing: 4px;
    line-height: 1;
    color: #e6ecff;
  }

  .text {
    font-size: 16px;
    color: #7a86a8;
    margin-top: 16px;
    letter-spacing: 1px;
    text-align: center;
  }

  .signature {
    position: fixed;
    right: 24px;
    bottom: 20px;
    font-size: 12px;
    color: #7a86a8;
    opacity: 0.5;
    font-family: monospace;
    letter-spacing: 0.5px;
  }

  @media (max-width: 480px) {
    .code { font-size: 72px; }
    .text { font-size: 14px; }
    .signature { font-size: 11px; right: 16px; bottom: 14px; }
  }
</style>
</head>
<body>

  <div class="code">404</div>

  <div class="text">страница не найдена</div>

  <div class="signature">nomorepainer</div>

</body>
</html>
